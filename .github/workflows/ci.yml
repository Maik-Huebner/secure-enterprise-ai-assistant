name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.9"
          cache: pip
          cache-dependency-path: requirements/lock-py313.txt
      - name: Install exact CPU runtime and lock
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.14.0+cpu"
          python -m pip install --no-deps -r requirements/lock-py313.txt
          python -m pip install --no-deps --no-build-isolation .
      - name: Prove non-editable site-packages import
        run: |
          python - <<'PY'
          from pathlib import Path
          import secure_enterprise_ai_assistant as package

          package_path = Path(package.__file__).resolve()
          assert "site-packages" in package_path.parts, package_path
          print(package_path)
          PY
      - run: make quality PYTHON=python
      - run: make test PYTHON=python
      - run: make evidence-check PYTHON=python
      - run: make audit PYTHON=python
      - run: python -m pip check
      - run: make build PYTHON=python
      - name: Isolated wheel smoke
        run: |
          python -m venv --system-site-packages /tmp/novabank-wheel-smoke
          /tmp/novabank-wheel-smoke/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/novabank-wheel-smoke/bin/python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          import secure_enterprise_ai_assistant as package
          from secure_enterprise_ai_assistant.mcp.tools import MCPToolService

          package_path = Path(package.__file__).resolve()
          assert "site-packages" in package_path.parts, package_path
          assert package.__version__ == version("secure-enterprise-ai-assistant")
          assert MCPToolService.build_default().get_customer_case("CASE-00001").case.case_id == "CASE-00001"
          print(package_path)
          PY

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build application image
        run: docker build --tag novabank-assistant:ci .
