[project]
name = "secure-enterprise-ai-assistant"
version = "1.0.2"
description = "Security-oriented local AI portfolio reference with CrewAI, MCP, RAG, and synthetic financial workflows."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Maik Huebner" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "crewai==1.15.20",
    "crewai-tools[mcp]==1.15.20",
    "gradio==6.26.0",
    "sentence-transformers==6.0.1",
    "faiss-cpu==1.15.0",
    "bm25s==0.3.11",
    "httpx==0.28.1",
    "mcp==1.28.1",
    "numpy==2.5.3",
    "pdfplumber==0.11.10",
    "platformdirs==4.11.8",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.3",
]

[project.scripts]
novabank-ui = "secure_enterprise_ai_assistant.ui.app:main"
novabank-mcp = "secure_enterprise_ai_assistant.mcp.server:main"
novabank-evaluate = "secure_enterprise_ai_assistant.evaluation.runner:main"

[project.optional-dependencies]
dev = [
    "build==1.6.1",
    "pytest==9.1.1",
    "ruff==0.16.6",
    "wheel==0.48.0",
]

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
secure_enterprise_ai_assistant = [
    "resources/compliance/*.json",
    "resources/customers/*.json",
    "resources/evaluation/*.json",
    "resources/knowledge_base/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:function_calling_llm is deprecated.*:DeprecationWarning",
    "ignore:^deprecated$:DeprecationWarning",
    "ignore:Cannot set an attribute on 'crewai\\.rag' for child module 'embeddings':ImportWarning",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
