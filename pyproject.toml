[project]
name = "secure-enterprise-ai-assistant"
version = "1.0.1"
description = "Local-first agentic AI platform with CrewAI, MCP, advanced RAG and enterprise financial workflows."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [
    { name = "Maik Huebner" }
]

dependencies = [
    "crewai==1.15.20",
    "crewai-tools[mcp]==1.15.20",
    "gradio==6.26.0",
    "sentence-transformers==6.0.1",
    "faiss-cpu==1.15.0",
    "bm25s==0.3.11",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.3",
]

[project.scripts]
novabank-ui = "secure_enterprise_ai_assistant.ui.app:main"
novabank-mcp = "secure_enterprise_ai_assistant.mcp.server:main"
novabank-evaluate = "secure_enterprise_ai_assistant.evaluation.runner:main"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore:function_calling_llm is deprecated.*:DeprecationWarning",
    "ignore:^deprecated$:DeprecationWarning",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
