[project]
name = "secure-enterprise-ai-assistant"
version = "2.1.0"
description = "Security-oriented local AI portfolio reference with LangGraph, MCP, RAG, and synthetic financial workflows."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Maik Huebner" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "argon2-cffi==25.1.0",
    "gradio==6.32.0",
    "sentence-transformers==6.0.1",
    "faiss-cpu==1.15.0",
    "fastapi==0.141.1",
    "bm25s==0.3.11",
    "httpx==0.28.1",
    "httpx2==2.16.2",
    "langchain-core==1.8.1",
    "langchain-ollama==1.1.0",
    "langfuse==5.2.0",
    "langgraph==1.2.22",
    "langgraph-checkpoint-sqlite==3.1.3",
    "mcp==2.3.0",
    "numpy==2.5.3",
    "pdfplumber==0.11.10",
    "platformdirs==4.11.8",
    "pyjwt==2.15.1",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.3",
    "uvicorn==0.52.4",
]

[project.scripts]
novabank-ui = "secure_enterprise_ai_assistant.ui.app:main"
novabank-mcp = "secure_enterprise_ai_assistant.mcp.server:main"
novabank-evaluate = "secure_enterprise_ai_assistant.evaluation.runner:main"
novabank-index = "secure_enterprise_ai_assistant.rag.cli:main"
novabank-api = "secure_enterprise_ai_assistant.api.app:main"
novabank-users = "secure_enterprise_ai_assistant.security.cli:main"
novabank-audit = "secure_enterprise_ai_assistant.security.audit:main"
novabank-langfuse = "secure_enterprise_ai_assistant.observability.cli:main"

[project.optional-dependencies]
dev = [
    "build==1.6.1",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.5",
    "wheel==0.48.0",
]

[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
secure_enterprise_ai_assistant = [
    "py.typed",
    "resources/compliance/*.json",
    "resources/customers/*.json",
    "resources/evaluation/*.json",
    "resources/knowledge_base/*.md",
    "resources/retrieval/*.json",
    "resources/routing/*.json",
    "resources/security/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs a running Ollama with the configured models (make test-live)"]
addopts = "-m 'not live'"
filterwarnings = [
]

[tool.coverage.run]
source = ["secure_enterprise_ai_assistant"]
branch = false

[tool.coverage.report]
# Measured 85 % on 16.11.2026. Code executed only in subprocesses (MCP stdio server, UI probe)
# and the repository audit (run via `make audit`) are not counted.
fail_under = 80
skip_covered = true
show_missing = true

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["src", "scripts", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
# Settings deliberately accept the legacy OLLAMA_MODEL alias via AliasChoices.
warn_required_dynamic_aliases = false

[[tool.mypy.overrides]]
# Third-party packages without type information.
module = ["bm25s", "bm25s.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Test bodies are type-checked; test-function signatures need no annotations.
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
